services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: librairie
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 5

  backend:
    build:
      context: ./backend
      target: final
    ports:
      - "8000:8000"
    environment:
      APP_ENV: prod
      APP_SECRET: changeme_32chars_secret_key_here
      DATABASE_URL: mysql://root:root@db:3306/librairie
      JWT_SECRET_KEY: /var/www/html/config/jwt/private.pem
      JWT_PUBLIC_KEY: /var/www/html/config/jwt/public.pem
      JWT_PASSPHRASE: your_jwt_secret_passphrase
      CORS_ALLOW_ORIGIN: '^https?://(localhost|127\.0\.0\.1)(:[0-9]+)?$'
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: final
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  db_data:
