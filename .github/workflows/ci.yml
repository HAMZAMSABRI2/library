name: CI Pipeline

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:

  # ══════════════════════════════════════════════════════════════════════════════
  # STEP 1 ── CLEAN
  # ══════════════════════════════════════════════════════════════════════════════
  clean-backend:
    name: "Clean · Backend"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql, intl
      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-
      - name: Install dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist
      - name: Validate composer.json
        working-directory: backend
        run: composer validate --strict
      - name: PHP syntax check
        working-directory: backend
        run: find src -name "*.php" | xargs -n 1 php -l

  clean-frontend:
    name: "Clean · Frontend"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: TypeScript check
        working-directory: frontend
        run: npx tsc --noEmit

  # ══════════════════════════════════════════════════════════════════════════════
  # STEP 2 ── TEST
  # ══════════════════════════════════════════════════════════════════════════════
  test-backend:
    name: "Test · Backend (PHPUnit)"
    runs-on: ubuntu-latest
    needs: clean-backend
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql, intl
          coverage: xdebug
      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.lock') }}
      - name: Install dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist
      - name: Generate JWT keys
        working-directory: backend
        run: |
          mkdir -p config/jwt
          openssl genpkey -algorithm RSA -out config/jwt/private.pem \
            -aes256 -pass pass:test_passphrase -pkeyopt rsa_keygen_bits:2048
          openssl pkey -in config/jwt/private.pem \
            -out config/jwt/public.pem -pubout -passin pass:test_passphrase
      - name: Setup test environment
        working-directory: backend
        run: |
          echo "DATABASE_URL=mysql://root:root@127.0.0.1:3306/librairie" > .env.test.local
          echo "JWT_PASSPHRASE=test_passphrase" >> .env.test.local
          echo "APP_SECRET=test_secret_32chars_key_for_ci!!" >> .env.test.local
          mysql -h 127.0.0.1 -u root -proot -e "CREATE DATABASE IF NOT EXISTS librairie_test;"
          php bin/console doctrine:schema:create --env=test
      - name: Run PHPUnit
        working-directory: backend
        run: php vendor/bin/phpunit --coverage-clover=coverage.xml
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml

  test-frontend:
    name: "Test · Frontend (Vitest)"
    runs-on: ubuntu-latest
    needs: clean-frontend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Run Vitest with coverage
        working-directory: frontend
        run: npm run test:coverage
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/

  # ── TESTS : SELENIUM UI ──────────────────────────────────────────────────────
  test-selenium:
    name: Tests Selenium (UI)
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: librairie
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql, intl
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: maven-${{ hashFiles('tests-selenium/pom.xml') }}
          restore-keys: maven-
      - name: Install backend dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --quiet
      - name: Generate JWT keys
        working-directory: backend
        run: |
          mkdir -p config/jwt
          openssl genpkey -algorithm RSA -out config/jwt/private.pem \
            -aes256 -pass pass:test_passphrase -pkeyopt rsa_keygen_bits:2048
          openssl pkey -in config/jwt/private.pem \
            -out config/jwt/public.pem -pubout -passin pass:test_passphrase
      - name: Setup backend environment
        working-directory: backend
        run: |
          echo "DATABASE_URL=mysql://root:root@127.0.0.1:3306/librairie" > .env.local
          echo "JWT_PASSPHRASE=test_passphrase" >> .env.local
          echo "APP_SECRET=test_secret_32chars_key_for_ci!!" >> .env.local
          php bin/console doctrine:schema:create --no-interaction
      - name: Start backend server
        working-directory: backend
        run: APP_ENV=dev php -S localhost:8000 -t public/ &
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Start frontend dev server
        working-directory: frontend
        run: npm run dev &
      - name: Wait for servers to be ready
        run: |
          timeout 30 bash -c 'until curl -s http://localhost:8000 > /dev/null 2>&1; do sleep 1; done'
          timeout 30 bash -c 'until curl -s http://localhost:5173 > /dev/null 2>&1; do sleep 1; done'
      - name: Seed test data
        run: |
          USER_RESP=$(curl -s -X POST http://localhost:8000/api/auth/register \
            -H "Content-Type: application/json" \
            -d '{"email":"hamza@mail.com","password":"123456","nom":"Hamza","prenom":"Msabri","role":"ROLE_ADMIN"}')
          USER_ID=$(echo "$USER_RESP" | python3 -c "import sys,json; print(json.load(sys.stdin)['user']['id'])")
          curl -s -X POST http://localhost:8000/api/auth/register \
            -H "Content-Type: application/json" \
            -d '{"email":"alice@mail.com","password":"password123","nom":"Alice","prenom":"Dupont","role":"ROLE_USER"}'
          TOKEN=$(curl -s -X POST http://localhost:8000/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"hamza@mail.com","password":"123456"}' \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['token'])")
          LIVRE1_ID=$(curl -s -X POST http://localhost:8000/api/livres \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $TOKEN" \
            -d '{"isbn":"9780000000001","titre":"Le Petit Prince","auteur":"Antoine de Saint-Exupery","editeur":"Gallimard","annee":1943,"stock":5}' \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
          curl -s -X POST http://localhost:8000/api/livres \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $TOKEN" \
            -d '{"isbn":"9780000000002","titre":"Les Miserables","auteur":"Victor Hugo","editeur":"Pagnerre","annee":1862,"stock":3}'
          curl -s -X POST http://localhost:8000/api/emprunts \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $TOKEN" \
            -d "{\"user_id\":$USER_ID,\"livre_id\":$LIVRE1_ID}"
      - name: Run Selenium tests
        working-directory: tests-selenium
        env:
          HEADLESS: "true"
        run: mvn test -q
      - name: Upload Selenium reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-reports
          path: tests-selenium/target/surefire-reports/

  # ══════════════════════════════════════════════════════════════════════════════
  # STEP 3 ── QUALITÉ DE CODE
  # ══════════════════════════════════════════════════════════════════════════════
  sonar:
    name: "Quality · SonarCloud"
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend, test-selenium]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check SONAR_TOKEN
        id: sonar_check
        run: |
          if [ -z "${{ secrets.SONAR_TOKEN }}" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "::warning::SONAR_TOKEN not set - skipping SonarCloud"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi
      - name: Download backend coverage
        if: steps.sonar_check.outputs.skip == 'false'
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: backend/
      - name: Download frontend coverage
        if: steps.sonar_check.outputs.skip == 'false'
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
      - name: SonarCloud Scan
        if: steps.sonar_check.outputs.skip == 'false'
        uses: SonarSource/sonarqube-scan-action@v5.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

  # ══════════════════════════════════════════════════════════════════════════════
  # STEP 4 ── SÉCURITÉ
  # ══════════════════════════════════════════════════════════════════════════════
  codeql:
    name: "Security · CodeQL (JavaScript)"
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend, test-selenium]
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript
      - name: Autobuild
        uses: github/codeql-action/autobuild@v4
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript"
          output: sarif-results
          upload: true
      - name: Upload SARIF artifact (pour IA)
        uses: actions/upload-artifact@v4
        with:
          name: sarif-js
          path: sarif-results/

  php-security:
    name: "Security · PHP Audit"
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend, test-selenium]
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Install dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --quiet
      - name: Composer audit (known CVEs)
        working-directory: backend
        run: |
          composer audit --format=json --no-interaction 2>/dev/null \
            > ../php-audit.json || true
      - name: Upload PHP audit artifact (pour IA)
        uses: actions/upload-artifact@v4
        with:
          name: php-audit
          path: php-audit.json

  # ── IA Security Check ────────────────────────────────────────────────────────
  ia-security-check:
    name: "Security · IA Check (GitHub Models)"
    runs-on: ubuntu-latest
    needs: [codeql, php-security]
    permissions:
      models: read          # requis pour GitHub Models API
    steps:
      - uses: actions/checkout@v4
      - name: Download CodeQL SARIF
        uses: actions/download-artifact@v4
        with:
          name: sarif-js
          path: sarif/js/
      - name: Download PHP audit
        uses: actions/download-artifact@v4
        with:
          name: php-audit
          path: audit/
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install OpenAI SDK
        run: pip install openai
      - name: Run IA Security Analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/ia_security_check.py
      - name: Upload IA Security Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ia-security-report
          path: ia-security-report.md

  # ══════════════════════════════════════════════════════════════════════════════
  # RELEASE V1.0.x
  # ══════════════════════════════════════════════════════════════════════════════
  release:
    name: "Release · V1.0.${{ github.run_number }}"
    runs-on: ubuntu-latest
    needs: [sonar, ia-security-check]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set version tag
        id: version
        run: echo "tag=v1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - name: Create release archive
        run: |
          VERSION=${{ steps.version.outputs.tag }}
          tar -czf release-${VERSION}.tar.gz \
            --exclude='.git' \
            --exclude='backend/vendor' \
            --exclude='frontend/node_modules' \
            .
          echo "RELEASE_FILE=release-${VERSION}.tar.gz" >> $GITHUB_ENV
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Release ${{ steps.version.outputs.tag }}"
          body: |
            ## Release ${{ steps.version.outputs.tag }}
            - Commit         : `${{ github.sha }}`
            - Tests PHPUnit  : passed
            - Tests Vitest   : passed
            - Tests Selenium : passed
            - SonarCloud     : passed
            - CodeQL (JS)    : passed
            - PHP Audit      : passed
            - IA Check       : passed
          files: ${{ env.RELEASE_FILE }}
          generate_release_notes: true

  # ══════════════════════════════════════════════════════════════════════════════
  # STEP 5 ── BUILD
  # ══════════════════════════════════════════════════════════════════════════════
  build-docker:
    name: "Build · Docker → GHCR"
    runs-on: ubuntu-latest
    needs: release
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:latest
            ghcr.io/${{ github.repository }}/backend:${{ needs.release.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/frontend:latest
            ghcr.io/${{ github.repository }}/frontend:${{ needs.release.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ══════════════════════════════════════════════════════════════════════════════
  # STEP 6 ── DEPLOY
  # ══════════════════════════════════════════════════════════════════════════════
  deploy:
    name: "Deploy · Production"
    runs-on: ubuntu-latest
    needs: [release, build-docker]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy from GHCR
        run: |
          echo "Deploying ${{ needs.release.outputs.version }} to production"
          echo "  backend  → ghcr.io/${{ github.repository }}/backend:${{ needs.release.outputs.version }}"
          echo "  frontend → ghcr.io/${{ github.repository }}/frontend:${{ needs.release.outputs.version }}"
          # TODO: remplacer par SSH / kubectl / docker-compose pull
