name: CI Pipeline

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:

  # ══════════════════════════════════════════════════════════════════════════════
  # STEP 1 ── CLEAN
  # ══════════════════════════════════════════════════════════════════════════════
  clean-backend:
    name: "Clean · Backend"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql, intl

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist

      - name: Validate composer.json
        working-directory: backend
        run: composer validate --strict

      - name: PHP syntax check
        working-directory: backend
        run: find src -name "*.php" | xargs -n 1 php -l

  clean-frontend:
    name: "Clean · Frontend"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript check
        working-directory: frontend
        run: npx tsc --noEmit

  # ══════════════════════════════════════════════════════════════════════════════
  # STEP 2 ── TEST
  # ══════════════════════════════════════════════════════════════════════════════
  test-backend:
    name: "Test · Backend (PHPUnit)"
    runs-on: ubuntu-latest
    needs: clean-backend

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: librairie_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql, intl
          coverage: xdebug

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.lock') }}

      - name: Install dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist

      - name: Generate JWT keys
        working-directory: backend
        run: |
          mkdir -p config/jwt
          openssl genpkey -algorithm RSA -out config/jwt/private.pem \
            -aes256 -pass pass:test_passphrase -pkeyopt rsa_keygen_bits:2048
          openssl pkey -in config/jwt/private.pem \
            -out config/jwt/public.pem -pubout -passin pass:test_passphrase

      - name: Setup test environment
        working-directory: backend
        env:
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/librairie_test
          JWT_PASSPHRASE: test_passphrase
        run: |
          cp .env .env.test.local
          echo "DATABASE_URL=mysql://root:root@127.0.0.1:3306/librairie_test" >> .env.test.local
          echo "JWT_PASSPHRASE=test_passphrase" >> .env.test.local
          php bin/console doctrine:schema:create --env=test

      - name: Run PHPUnit
        working-directory: backend
        env:
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/librairie_test
          JWT_PASSPHRASE: test_passphrase
        run: php vendor/bin/phpunit --coverage-clover=coverage.xml

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml

  test-frontend:
    name: "Test · Frontend (Vitest)"
    runs-on: ubuntu-latest
    needs: clean-frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Vitest with coverage
        working-directory: frontend
        run: npm run test:coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/

  # ══════════════════════════════════════════════════════════════════════════════
  # STEP 3 ── QUALITÉ DE CODE
  # ══════════════════════════════════════════════════════════════════════════════
  sonar:
    name: "Quality · SonarCloud"
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download backend coverage
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: backend/

      - name: Download frontend coverage
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ══════════════════════════════════════════════════════════════════════════════
  # STEP 4 ── SÉCURITÉ
  # ══════════════════════════════════════════════════════════════════════════════

  # 4a. CodeQL static analysis — PHP
  codeql-php:
    name: "Security · CodeQL (PHP)"
    runs-on: ubuntu-latest
    needs: sonar
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: php
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:php"
          output: sarif-results
          upload: true

      - name: Upload PHP SARIF artifact
        uses: actions/upload-artifact@v4
        with:
          name: sarif-php
          path: sarif-results/

  # 4b. CodeQL static analysis — JavaScript / TypeScript
  codeql-js:
    name: "Security · CodeQL (JS/TS)"
    runs-on: ubuntu-latest
    needs: sonar
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
          output: sarif-results
          upload: true

      - name: Upload JS SARIF artifact
        uses: actions/upload-artifact@v4
        with:
          name: sarif-js
          path: sarif-results/

  # 4c. IA Security Check — Claude analyses CodeQL SARIF results
  ia-security-check:
    name: "Security · IA Check (Claude)"
    runs-on: ubuntu-latest
    needs: [codeql-php, codeql-js]
    steps:
      - uses: actions/checkout@v4

      - name: Download PHP SARIF
        uses: actions/download-artifact@v4
        with:
          name: sarif-php
          path: sarif/php/

      - name: Download JS SARIF
        uses: actions/download-artifact@v4
        with:
          name: sarif-js
          path: sarif/js/

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Anthropic SDK
        run: pip install anthropic

      - name: Run IA Security Analysis
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python .github/scripts/ia_security_check.py

      - name: Upload IA Security Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ia-security-report
          path: ia-security-report.md

  # ══════════════════════════════════════════════════════════════════════════════
  # RELEASE V1.0.x — Généré après Security
  # Archive source → GitHub Releases  |  Images Docker → GHCR
  # ══════════════════════════════════════════════════════════════════════════════
  release:
    name: "Release · V1.0.${{ github.run_number }}"
    runs-on: ubuntu-latest
    needs: ia-security-check
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set version tag
        id: version
        run: echo "tag=v1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Create release archive
        run: |
          VERSION=${{ steps.version.outputs.tag }}
          tar -czf release-${VERSION}.tar.gz \
            --exclude='.git' \
            --exclude='backend/vendor' \
            --exclude='frontend/node_modules' \
            .
          echo "RELEASE_FILE=release-${VERSION}.tar.gz" >> $GITHUB_ENV

      - name: Publish GitHub Release (= Artifactory Generic)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Release ${{ steps.version.outputs.tag }}"
          body: |
            ## Release ${{ steps.version.outputs.tag }}
            - Commit : `${{ github.sha }}`
            - CodeQL PHP + JS/TS : passed
            - IA Security Check  : passed
            - SonarCloud         : passed
          files: ${{ env.RELEASE_FILE }}
          generate_release_notes: true

  # ══════════════════════════════════════════════════════════════════════════════
  # STEP 5 ── BUILD — Images Docker → GHCR (GitHub Container Registry)
  # ══════════════════════════════════════════════════════════════════════════════
  build-docker:
    name: "Build · Docker → GHCR"
    runs-on: ubuntu-latest
    needs: release
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:latest
            ghcr.io/${{ github.repository }}/backend:${{ needs.release.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/frontend:latest
            ghcr.io/${{ github.repository }}/frontend:${{ needs.release.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ══════════════════════════════════════════════════════════════════════════════
  # STEP 6 ── DEPLOY
  # ══════════════════════════════════════════════════════════════════════════════
  deploy:
    name: "Deploy · Production"
    runs-on: ubuntu-latest
    needs: [release, build-docker]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy from GHCR
        run: |
          echo "Deploying ${{ needs.release.outputs.version }} to production"
          echo "  backend  → ghcr.io/${{ github.repository }}/backend:${{ needs.release.outputs.version }}"
          echo "  frontend → ghcr.io/${{ github.repository }}/frontend:${{ needs.release.outputs.version }}"
          # TODO: remplacer par la commande réelle (SSH, kubectl, docker-compose pull, etc.)
