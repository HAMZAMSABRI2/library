name: CI Pipeline

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:

  # ══════════════════════════════════════════════════════════════════════════════
  # STEP 1 ── CLEAN
  # ══════════════════════════════════════════════════════════════════════════════
  clean-backend:
    name: "Clean · Backend"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql, intl

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist

      - name: Validate composer.json
        working-directory: backend
        run: composer validate --strict

      - name: PHP syntax check
        working-directory: backend
        run: find src -name "*.php" | xargs -n 1 php -l

  clean-frontend:
    name: "Clean · Frontend"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript check
        working-directory: frontend
        run: npx tsc --noEmit

  # ══════════════════════════════════════════════════════════════════════════════
  # STEP 2 ── TEST
  # ══════════════════════════════════════════════════════════════════════════════
  test-backend:
    name: "Test · Backend (PHPUnit)"
    runs-on: ubuntu-latest
    needs: clean-backend

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: librairie_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql, intl
          coverage: xdebug

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.lock') }}

      - name: Install dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist

      - name: Generate JWT keys
        working-directory: backend
        run: |
          mkdir -p config/jwt
          openssl genpkey -algorithm RSA -out config/jwt/private.pem \
            -aes256 -pass pass:test_passphrase -pkeyopt rsa_keygen_bits:2048
          openssl pkey -in config/jwt/private.pem \
            -out config/jwt/public.pem -pubout -passin pass:test_passphrase

      - name: Setup test environment
        working-directory: backend
        env:
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/librairie_test
          JWT_PASSPHRASE: test_passphrase
        run: |
          cp .env .env.test.local
          echo "DATABASE_URL=mysql://root:root@127.0.0.1:3306/librairie_test" >> .env.test.local
          echo "JWT_PASSPHRASE=test_passphrase" >> .env.test.local
          php bin/console doctrine:schema:create --env=test

      - name: Run PHPUnit
        working-directory: backend
        env:
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/librairie_test
          JWT_PASSPHRASE: test_passphrase
        run: php vendor/bin/phpunit --coverage-clover=coverage.xml

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml

  test-frontend:
    name: "Test · Frontend (Vitest)"
    runs-on: ubuntu-latest
    needs: clean-frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Vitest with coverage
        working-directory: frontend
        run: npm run test:coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/

  # ══════════════════════════════════════════════════════════════════════════════
  # STEP 3 ── QUALITÉ DE CODE
  # ══════════════════════════════════════════════════════════════════════════════
  sonar:
    name: "Quality · SonarCloud"
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download backend coverage
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: backend/

      - name: Download frontend coverage
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ══════════════════════════════════════════════════════════════════════════════
  # STEP 4 ── SÉCURITÉ (CodeQL — gratuit GitHub)
  # ══════════════════════════════════════════════════════════════════════════════
  codeql:
    name: "Security · CodeQL (${{ matrix.language }})"
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [php, javascript-typescript]
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  # ══════════════════════════════════════════════════════════════════════════════
  # STEP 5 ── BUILD (Docker images → GHCR)
  # ══════════════════════════════════════════════════════════════════════════════
  build-docker:
    name: "Build · Docker Images"
    runs-on: ubuntu-latest
    needs: [sonar, codeql]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: ${{ github.ref == 'refs/heads/master' }}
          tags: |
            ghcr.io/${{ github.repository }}/backend:latest
            ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: ${{ github.ref == 'refs/heads/master' }}
          tags: |
            ghcr.io/${{ github.repository }}/frontend:latest
            ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ══════════════════════════════════════════════════════════════════════════════
  # STEP 6 ── DEPLOY
  # ══════════════════════════════════════════════════════════════════════════════
  deploy:
    name: "Deploy · Production"
    runs-on: ubuntu-latest
    needs: build-docker
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to production
        run: |
          echo "Deploying version ${{ github.sha }}"
          echo "  backend  → ghcr.io/${{ github.repository }}/backend:${{ github.sha }}"
          echo "  frontend → ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}"
          # TODO: remplacer par la commande réelle (SSH, kubectl, docker-compose pull, etc.)
