sonar.projectKey=HAMZAMSABRI2_library
sonar.organization=hamzamsabri2
sonar.projectName=BiblioApp

# Sources
sonar.sources=backend/src,frontend/src
sonar.exclusions=**/vendor/**,**/node_modules/**,**/var/**,**/dist/**

# Tests
sonar.tests=backend/tests,frontend/src
sonar.test.inclusions=backend/tests/**,frontend/src/**/*.test.*,frontend/src/**/*.spec.*

# Coverage reports
sonar.php.coverage.reportPaths=backend/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# Encoding
sonar.sourceEncoding=UTF-8
